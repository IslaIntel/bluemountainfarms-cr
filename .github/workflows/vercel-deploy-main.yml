name: Deploy Vercel on main

# Vercel Git deploys are blocked when the commit author is a Viewer
# (Miguel, Guillermo, Enrique). Deploy hooks still check git author.
# This workflow deploys as Julius via the Vercel CLI so any push to
# the production branch goes live. If the CLI deploy fails, the job
# fails and Julius can Redeploy with workflow_dispatch or `vercel --prod`.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/vercel-deploy-main.yml'
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check required secrets
        env:
          PROJECTS: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${VERCEL_TOKEN:-}" ]; then echo "::error::VERCEL_TOKEN is not set"; missing=1; fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then echo "::error::VERCEL_ORG_ID is not set"; missing=1; fi
          if [ -z "${PROJECTS:-}" ]; then echo "::error::VERCEL_PROJECT_ID is not set"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "::error::Julius needs to set the Vercel GitHub secrets, then re-run this workflow or run: vercel --prod --yes --scope islaintel"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Re-author HEAD as the Vercel team owner
        run: |
          set -euo pipefail
          git config user.email "julius@islaintel.com"
          git config user.name "Julius Washington"
          git commit --amend --no-edit --reset-author --no-gpg-sign

      - name: Install Vercel CLI
        run: npm install -g vercel@54.21.1

      - name: Deploy each linked project to production
        env:
          PROJECTS: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r spec || [ -n "${spec:-}" ]; do
            spec="${spec//$'\r'/}"
            [ -z "${spec:-}" ] && continue
            project_id="${spec%%|*}"
            root="${spec#*|}"
            if [ "$root" = "$spec" ]; then
              root="."
            fi
            echo "::group::Deploy $project_id (root=$root)"
            export VERCEL_PROJECT_ID="$project_id"
            if (
              cd "$root"
              vercel pull --yes --environment=production --scope islaintel
              vercel deploy --prod --yes --scope islaintel
            ); then
              echo "Deployed $project_id"
            else
              echo "::error::CLI deploy failed for $project_id in ${{ github.repository }}@${{ github.sha }}. Julius: Actions → Re-run, or Run workflow, or: vercel --prod --yes --scope islaintel --cwd $root"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "$PROJECTS"
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
