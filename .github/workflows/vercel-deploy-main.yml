name: Deploy Vercel on main

# Vercel Git deploys are blocked when the commit author is a Viewer
# (Miguel, Guillermo, Enrique, Nando). This hook deploys as the project
# instead, so a push to the production branch still goes live.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '.github/workflows/vercel-deploy-main.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Vercel production deploy hook
        env:
          HOOKS: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${HOOKS:-}" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set; skipping"
            exit 0
          fi
          echo "$HOOKS" | while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "Triggering Vercel deploy hook"
            curl -fsS -X POST "$url"
            echo
          done
